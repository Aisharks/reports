<script>
// ═══════════════════════════════════════════
// THREE.JS PARTICLE NETWORK BACKGROUND
// ═══════════════════════════════════════════
(function(){
  const canvas=document.getElementById('particle-canvas');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:false,alpha:false});
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
  renderer.setClearColor('#06060b');

  const scene=new THREE.Scene();
  scene.fog=new THREE.Fog('#06060b',400,900);
  const camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,1,1000);
  camera.position.z=300;

  const COUNT=300,CONN=120;
  const positions=new Float32Array(COUNT*3);
  const velocities=[];
  const w=window.innerWidth,h=window.innerHeight;

  for(let i=0;i<COUNT;i++){
    positions[i*3]=(Math.random()-0.5)*w*1.5;
    positions[i*3+1]=(Math.random()-0.5)*h*1.5;
    positions[i*3+2]=(Math.random()-0.5)*200;
    velocities.push({vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,vz:(Math.random()-0.5)*0.05});
  }

  // Points
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(positions,3));
  const sizes=new Float32Array(COUNT);
  for(let i=0;i<COUNT;i++)sizes[i]=1+Math.random()*1.5;
  geo.setAttribute('size',new THREE.BufferAttribute(sizes,1));

  scene.add(new THREE.Points(geo,new THREE.PointsMaterial({
    color:'#6bb5ff',size:2,transparent:true,opacity:0.15,
    blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true
  })));

  // Connection lines
  const lineGeo=new THREE.BufferGeometry();
  const linePos=new Float32Array(COUNT*COUNT*6);
  const lineCol=new Float32Array(COUNT*COUNT*6);
  lineGeo.setAttribute('position',new THREE.BufferAttribute(linePos,3));
  lineGeo.setAttribute('color',new THREE.BufferAttribute(lineCol,3));
  const lineMat=new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:1,blending:THREE.AdditiveBlending,depthWrite:false});
  const lines=new THREE.LineSegments(lineGeo,lineMat);
  scene.add(lines);

  const mouse={x:0,y:0};
  window.addEventListener('mousemove',e=>{mouse.x=e.clientX-w/2;mouse.y=-(e.clientY-h/2)});

  function animate(){
    requestAnimationFrame(animate);
    const pos=geo.attributes.position.array;
    for(let i=0;i<COUNT;i++){
      const ix=i*3,iy=ix+1,iz=ix+2;
      const dx=mouse.x-pos[ix],dy=mouse.y-pos[iy];
      const distM=Math.sqrt(dx*dx+dy*dy);
      if(distM<150&&distM>1){const f=(1-distM/150)*0.3;velocities[i].vx+=(dx/distM)*f*0.01;velocities[i].vy+=(dy/distM)*f*0.01}
      pos[ix]+=velocities[i].vx;pos[iy]+=velocities[i].vy;pos[iz]+=velocities[i].vz;
      if(pos[ix]<-w*0.8||pos[ix]>w*0.8)velocities[i].vx*=-1;
      if(pos[iy]<-h*0.8||pos[iy]>h*0.8)velocities[i].vy*=-1;
      if(pos[iz]<-100||pos[iz]>100)velocities[i].vz*=-1;
    }
    geo.attributes.position.needsUpdate=true;

    let li=0;
    for(let i=0;i<COUNT;i++){
      for(let j=i+1;j<COUNT;j++){
        const dx=pos[i*3]-pos[j*3],dy=pos[i*3+1]-pos[j*3+1];
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d<CONN){
          const a=(1-d/CONN)*0.06;
          const b=li*6;
          [pos[i*3],pos[i*3+1],pos[i*3+2],pos[j*3],pos[j*3+1],pos[j*3+2]].forEach((v,i)=>linePos[b+i]=v);
          for(let k=0;k<6;k++)lineCol[b+k]=0.42*a*(k%3===2?1.69:1); // 0.42,0.71,1.0 normalized
          li++;
        }
      }
    }
    for(let i=li*6;i<linePos.length;i++)linePos[i]=0;
    lineGeo.attributes.position.needsUpdate=true;
    lineGeo.attributes.color.needsUpdate=true;
    lineGeo.setDrawRange(0,li*2);
    renderer.render(scene,camera);
  }
  animate();
  window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)});
})();

// ═══════════════════════════════════════════
// APP STATE & DATA
// ═══════════════════════════════════════════

let showConfig=true;

// ═══════════════════════════════════════════
// DATA LOADING
// ═══════════════════════════════════════════
async function loadData(){
  // Strategy 1: Try fetch (works on http/https servers)
  try{
    const res=await fetch('./data.json');
    if(res.ok){songData=await res.json();console.log('Loaded via fetch');finishLoad();return}
  }catch(e){console.log('fetch failed (expected for file://):',e.message)}

  // Strategy 2: Fallback to embedded JSON (works for local file://)
  try{
    const el=document.getElementById('app-data');
    if(el){songData=JSON.parse(el.textContent);console.log('Loaded via embedded JSON');finishLoad();return}
  }catch(e){console.error('Embedded JSON parse failed:',e)}

  // Strategy 3: Show error with instructions
  document.getElementById('loading').innerHTML=
    '<span style="font-size:18px">❌ 数据加载失败</span><br><br>'+
    '<span style="font-size:13px">可能原因：</span><br>'+
    '<span style="font-size:12px">1. data.json 不存在于同目录</span><br>'+
    '<span style="font-size:12px">2. 使用 file:// 协议时浏览器拦截了 fetch（已自动回退到内嵌数据，但仍失败）</span><br><br>'+
    '<span style="font-size:12px">解决方案：用本地服务器打开，如 npx serve 或 python -m http.server</span>';
}
function finishLoad(){
  document.getElementById('loading').style.display='none';
  document.getElementById('nav-song').textContent=songData.songTitle||'未命名';
  renderAll();
}

function renderAll(){
  const main=document.getElementById('main');

  main.innerHTML=configHTML+`
    ${renderWarning()}
    ${renderPageHeader()}
    ${renderTitleBlock()}
    ${renderBulkCopy()}
    ${renderLyrics()}
    ${renderPrompts()}
    ${renderMeta()}
    ${renderCover()}
    ${renderCopyTexts()}
    ${renderFooter()}
  `;
  attachCopyListeners();
  setupRevealAnimation();
}

// ═══════════════════════════════════════════
// ESCAPE HTML
// ═══════════════════════════════════════════
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// ═══════════════════════════════════════════
// COPY SYSTEM
// ═══════════════════════════════════════════
let copiedId=null;
function doCopy(text,id){
  const realText=text||'【内容为空】';
  navigator.clipboard.writeText(realText).catch(()=>{
    const ta=document.createElement('textarea');ta.value=realText;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
  });
  // Show toast
  const t=document.getElementById('toast');
  t.textContent='✅ 已复制到剪贴板';t.className='toast';
  setTimeout(()=>{t.textContent='';t.className=''},2500);
  // Button feedback
  document.querySelectorAll('.copy-btn').forEach(btn=>{
    if(btn.dataset.type===id){btn.textContent='✓ 已复制';btn.classList.add('btn-gold');btn.classList.remove('btn-outline')}
    else{btn.textContent='📋 复制';btn.classList.remove('btn-gold');btn.classList.add('btn-outline')}
  });
  if(copiedId)clearTimeout(copiedId);
  copiedId=setTimeout(()=>{
    document.querySelectorAll('.copy-btn').forEach(btn=>{btn.textContent='📋 复制';btn.classList.remove('btn-gold');btn.classList.add('btn-outline')});
  },2000);
}

function attachCopyListeners(){
  document.querySelectorAll('.copy-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const type=btn.dataset.type;
      if(type==='lyrics')doCopy(songData.lyrics.map(s=>`[${s.label}]\n${s.lines.join('\n')}`).join('\n\n'),type);
      else if(type==='prompt')doCopy(`【Style】\n${songData.prompt.style}\n\n【Meta】\n${songData.prompt.metaTags}\n\n【Negative】\n${songData.prompt.negative}`,type);
      else if(type==='all')doCopy(`【${songData.songTitle}】\n\n${songData.lyrics.map(s=>`[${s.label}]\n${s.lines.join('\n')}`).join('\n\n')}\n\n【Style】\n${songData.prompt.style}\n\n【Meta】\n${songData.prompt.metaTags}\n\n【Negative】\n${songData.prompt.negative}\n\n【封面】\n${songData.cover.main}\n\n【短】\n${songData.copy.shortDesc}\n\n【笔记】\n${songData.copy.note}\n\n【长】\n${songData.copy.long}`,type);
      else if(type==='prompt-style')doCopy(songData.prompt.style,type);
      else if(type==='prompt-metaTags')doCopy(songData.prompt.metaTags,type);
      else if(type==='prompt-negative')doCopy(songData.prompt.negative,type);
      else if(type==='cover-main')doCopy(songData.cover.main,type);
      else if(type==='cover-alt')doCopy(songData.cover.alt,type);
      else if(type==='copy-shortDesc')doCopy(songData.copy.shortDesc,type);
      else if(type==='copy-note')doCopy(songData.copy.note,type);
      else if(type==='copy-long')doCopy(songData.copy.long,type);
    });
  });
}

  showConfig=!showConfig;
  const panel=document.getElementById('config-panel');
  if(panel)panel.style.display=showConfig?'block':'none';
  document.getElementById('toggle-config').innerHTML=showConfig?'🔧 隐藏配置':'🔧 数据配置';
}
document.getElementById('toggle-config').addEventListener('click',toggleConfig);

function applyConfig(){
  songData.songTitle=document.getElementById('cfg-title').value;
  songData.songArtist=document.getElementById('cfg-artist').value;
  songData.tags=document.getElementById('cfg-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  songData.prompt.style=document.getElementById('cfg-style').value;
  songData.prompt.metaTags=document.getElementById('cfg-meta').value;
  songData.prompt.negative=document.getElementById('cfg-neg').value;
  songData.cover.main=document.getElementById('cfg-cover-main').value;
  songData.cover.alt=document.getElementById('cfg-cover-alt').value;
  songData.copy.shortDesc=document.getElementById('cfg-short').value;
  songData.copy.note=document.getElementById('cfg-note').value;
  songData.copy.long=document.getElementById('cfg-long').value;

  // Meta rows
  document.querySelectorAll('#cfg-meta-rows .meta-row').forEach((row,idx)=>{
    const inputs=row.querySelectorAll('input');
    if(songData.meta[idx]){songData.meta[idx].field=inputs[0].value;songData.meta[idx].value=inputs[1].value;songData.meta[idx].desc=inputs[2].value}
  });

  // Lyric rows
  document.querySelectorAll('#cfg-lyric-rows .lyric-row').forEach((row,idx)=>{
    const sel=row.querySelector('select');
    const inputs=row.querySelectorAll('input,textarea');
    if(songData.lyrics[idx]){
      songData.lyrics[idx].type=sel.value;
      songData.lyrics[idx].label=inputs[0].value;
      songData.lyrics[idx].lines=inputs[1].value.split('\n');
    }
  });

  document.getElementById('nav-song').textContent=songData.songTitle;
  renderAll();
  // Re-show config
  showConfig=true;
  document.getElementById('toggle-config').innerHTML='🔧 隐藏配置';
}

// ═══════════════════════════════════════════
// SCROLL REVEAL ANIMATION
// ═══════════════════════════════════════════
function setupRevealAnimation(){
  const observer=new IntersectionObserver((entries)=>{
    entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible')})
  },{threshold:0.1});
  document.querySelectorAll('.reveal').forEach(el=>observer.observe(el));
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
loadData();
</script>
