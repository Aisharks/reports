<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>龙舟上的时间 · 三版赛马</title>
<style>
  :root {
    --bg0:#0a0b10; --bg1:#13151f; --bg2:#1c1f2d; --bg3:#25293a; --bg4:#2f3450;
    --text:#e0e2ec; --text2:#8b90a8; --text3:#565b73;
    --border:#282d40;
    --r:#ff4d6d; --r2:rgba(255,77,109,0.15); --r3:rgba(255,77,109,0.3);
    --g:#00d9a3; --g2:rgba(0,217,163,0.15); --g3:rgba(0,217,163,0.3);
    --b:#4f8cff; --b2:rgba(79,140,255,0.15); --b3:rgba(79,140,255,0.3);
    --gold:#ffc447; --gold2:rgba(255,196,71,0.15);
    --shadow:0 8px 32px rgba(0,0,0,0.3);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg0);color:var(--text);min-height:100vh}
  #particles{position:fixed;inset:0;z-index:0;pointer-events:none}

  /* ===== 顶部栏 ===== */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,11,16,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:12px}
  .topbar-center{position:absolute;left:50%;transform:translateX(-50%);font-size:15px;font-weight:800;letter-spacing:1px;color:var(--text);white-space:nowrap}
  .ver-tab{padding:6px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid transparent;transition:.2s;opacity:0.4}
  .ver-tab:hover{opacity:0.8;background:var(--bg2)}
  .ver-tab.on{opacity:1;border-color:currentColor;background:var(--bg2);box-shadow:0 0 12px currentColor}
  .ver-tab.a{color:var(--r);border-color:var(--r3)} .ver-tab.b{color:var(--g);border-color:var(--g3)} .ver-tab.c{color:var(--b);border-color:var(--b3)}
  .tools{margin-left:auto;display:flex;gap:8px;align-items:center}
  .btn{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;border:1px solid var(--border);background:var(--bg2);color:var(--text2);transition:.2s}
  .btn:hover{background:var(--bg3);color:var(--text)}
  .btn.on{background:var(--gold2);color:var(--gold);border-color:rgba(255,196,71,0.3)}
  .btn.copied{background:rgba(0,217,163,0.2)!important;color:var(--g)!important;border-color:var(--g3)!important}

  /* ===== 主区域 ===== */
  .main{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:64px 16px 40px}

  .view{display:none}.view.on{display:block}

  /* ===== 滚动模式 ===== */
  .scroll-view .ver-block{margin-bottom:24px;background:var(--bg1);border:1px solid var(--border);border-radius:18px;overflow:hidden;position:relative;scroll-margin-top:70px}
  .scroll-view .ver-block::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
  .scroll-view .ver-block.a::before{background:linear-gradient(90deg,var(--r),transparent);box-shadow:0 0 30px var(--r3)}
  .scroll-view .ver-block.b::before{background:linear-gradient(90deg,var(--g),transparent);box-shadow:0 0 30px var(--g3)}
  .scroll-view .ver-block.c::before{background:linear-gradient(90deg,var(--b),transparent);box-shadow:0 0 30px var(--b3)}

  /* 头部：歌名 + 模型 */
  .ver-header{padding:16px 18px 12px;border-bottom:1px solid var(--border)}
  .ver-title-row{display:flex;gap:10px;align-items:center;margin-bottom:10px}
  .ver-name{flex:1;background:transparent;border:none;border-bottom:1px solid var(--border);border-radius:4px;padding:6px 8px;font-size:18px;font-weight:800;font-family:inherit;color:var(--text);outline:none;transition:.2s}
  .ver-name:focus{border-bottom-color:var(--b)}
  .ver-name::placeholder{color:var(--text3);font-style:italic}
  .ver-model{flex:0 0 140px;background:transparent;border:none;border-bottom:1px solid var(--border);border-radius:4px;padding:6px 8px;font-size:12px;font-family:inherit;color:var(--text2);outline:none}
  .ver-model:focus{border-bottom-color:var(--gold);color:var(--text)}
  .ver-model::placeholder{color:var(--text3)}

  /* Prompt行 */
  .prompt-row{display:flex;gap:8px;align-items:center;padding:10px 18px;background:var(--bg2);border-bottom:1px solid var(--border)}
  .prompt-input{flex:1;background:transparent;border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px;font-family:inherit;color:var(--text2);outline:none;resize:none;height:36px;line-height:1.5}
  .prompt-input:focus{border-color:var(--b);color:var(--text)}
  .prompt-input::placeholder{color:var(--text3)}
  .btn-sm{padding:6px 12px;border-radius:6px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text2);transition:.2s;white-space:nowrap}
  .btn-sm:hover{background:var(--bg4);color:var(--text)}

  .ver-body{padding:14px 18px}

  /* ===== 段落块 ===== */
  .sec{margin-bottom:12px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--bg2)}
  .sec-head{padding:8px 12px;background:var(--bg3);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sec-type{background:var(--bg4);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700;font-family:inherit;color:var(--text);outline:none;cursor:pointer}
  .sec-type option{background:var(--bg4)}
  .sec-style{flex:1;min-width:60px;background:transparent;border:none;border-bottom:1px solid var(--border);padding:3px 6px;font-size:11px;font-family:inherit;color:var(--text2);outline:none}
  .sec-style:focus{border-bottom-color:var(--gold);color:var(--text)}
  .sec-del{opacity:0.3;cursor:pointer;font-size:16px;color:var(--r);transition:.2s;padding:2px 6px;border:none;background:transparent}
  .sec:hover .sec-del{opacity:0.7}.sec-del:hover{opacity:1}

  .sec-body{padding:10px 12px;position:relative}
  .lyric-input{width:100%;min-height:100px;background:transparent;border:none;font-size:13px;line-height:2;font-family:inherit;color:var(--text);outline:none;resize:vertical}
  .lyric-input::placeholder{color:var(--text3);font-style:italic}
  .sec-actions{position:absolute;top:8px;right:8px;display:flex;gap:4px}
  .btn-copy{padding:4px 10px;border-radius:6px;font-size:10px;font-weight:700;font-family:inherit;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text2);transition:.2s}
  .btn-copy:hover{background:var(--bg4);color:var(--text)}

  /* 批注模式歌词行 */
  .lyric-lines{display:none}.annotate-on .lyric-input{display:none}.annotate-on .lyric-lines{display:block}
  .ly-line{padding:5px 10px;border-radius:6px;cursor:pointer;transition:.15s;font-size:13px;line-height:1.8;position:relative;border-left:2px solid transparent}
  .ly-line:hover{background:rgba(79,140,255,0.06)}
  .ly-line.has-anno{border-left-color:var(--gold);background:rgba(255,196,71,0.05)}
  .ly-line.active-anno{background:rgba(255,196,71,0.12)!important;border-left-color:var(--gold)}
  .anno-badge{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--gold);opacity:0.7}

  /* 底部添加按钮 — 发光脉冲版 */
  .add-wrap{display:flex;justify-content:center;padding:14px 0 18px}
  .add-btn-fancy{position:relative;width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--g),#00b894);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.3s;font-family:inherit;box-shadow:0 0 20px var(--g3),0 4px 12px rgba(0,0,0,0.3);animation:pulseGlow 2.5s ease-in-out infinite}
  .add-btn-fancy:hover{transform:scale(1.15) rotate(90deg);box-shadow:0 0 30px var(--g3),0 6px 20px rgba(0,0,0,0.4)}
  .add-btn-fancy:active{transform:scale(0.95)}
  @keyframes pulseGlow{0%,100%{box-shadow:0 0 15px var(--g3),0 4px 12px rgba(0,0,0,0.3)}50%{box-shadow:0 0 25px var(--g3),0 0 40px rgba(0,217,163,0.15),0 4px 12px rgba(0,0,0,0.3)}}

  /* ===== 批注面板 ===== */
  .anno-panel{position:fixed;right:-420px;top:56px;bottom:0;width:400px;background:var(--bg1);border-left:1px solid var(--border);z-index:99;transition:right .3s;padding:0;display:flex;flex-direction:column}
  .anno-panel.on{right:0}
  @media(max-width:900px){.anno-panel{width:300px;right:-320px}}

  .anno-edit{padding:16px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
  .anno-edit-head{font-size:14px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .anno-edit-head .close{margin-left:auto;cursor:pointer;font-size:16px;color:var(--text2)}
  .anno-edit-sub{font-size:11px;color:var(--text2);margin-bottom:10px}
  .anno-textarea{width:100%;min-height:120px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px;font-size:12px;line-height:1.7;font-family:inherit;color:var(--text);outline:none;resize:vertical}
  .anno-textarea:focus{border-color:var(--gold)}
  .anno-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}

  /* 批注列表 */
  .anno-list{flex:1;overflow-y:auto;padding:12px 18px}
  .anno-list-head{font-size:12px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
  .anno-item{background:var(--bg2);border-radius:10px;padding:12px;margin-bottom:10px;border:1px solid var(--border)}
  .anno-item-source{font-size:11px;color:var(--text3);margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--border)}
  .anno-item-text{font-size:12px;color:var(--text);line-height:1.7;margin-bottom:6px;word-break:break-all}
  .anno-item-lyric{font-size:11px;color:var(--text2);font-style:italic;padding:4px 8px;background:var(--bg3);border-radius:6px;margin-bottom:8px}
  .anno-item-del{font-size:10px;color:var(--r);cursor:pointer;background:transparent;border:none;padding:0;font-family:inherit}
  .anno-item-del:hover{text-decoration:underline}
  .anno-empty{text-align:center;color:var(--text3);font-size:12px;padding:30px 0;font-style:italic}

  /* ===== 对比模式 ===== */
  .compare-view .compare-grid{display:grid;gap:14px;transition:grid-template-columns .3s}
  .compare-view .compare-grid.cols-3{grid-template-columns:repeat(3,1fr)}
  .compare-view .compare-grid.cols-2{grid-template-columns:repeat(2,1fr)}
  .compare-view .compare-grid.cols-1{grid-template-columns:1fr}

  .comp-col{background:var(--bg1);border:1px solid var(--border);border-radius:16px;overflow:hidden}
  .comp-col::before{content:'';display:block;height:3px}
  .comp-col.a::before{background:var(--r)}.comp-col.b::before{background:var(--g)}.comp-col.c::before{background:var(--b)}
  .comp-head{padding:12px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:700}
  .comp-head.a{color:var(--r)}.comp-head.b{color:var(--g)}.comp-head.c{color:var(--b)}
  .comp-body{padding:12px;max-height:calc(100vh - 160px);overflow-y:auto}
  .comp-sec{margin-bottom:10px}
  .comp-sec-label{font-size:11px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:1px;padding:6px 0;border-bottom:1px solid var(--border);margin-bottom:6px}
  .comp-lyrics{font-size:13px;line-height:1.8;color:var(--text2);white-space:pre-wrap}

  /* 粒子 */
  @keyframes ph{0%,100%{opacity:0.3}50%{opacity:0.6}}
</style>
</head>
<body>
<canvas id="particles"></canvas>

<div class="topbar">
  <span class="ver-tab a on" onclick="toggleVerTab('a')" id="tab-a">版本 A</span>
  <span class="ver-tab b on" onclick="toggleVerTab('b')" id="tab-b">版本 B</span>
  <span class="ver-tab c on" onclick="toggleVerTab('c')" id="tab-c">版本 C</span>
  <div class="topbar-center" id="pageTitle">2026-05-18 · 龙舟上的时间 · 三版赛马</div>
  <div class="tools">
    <button class="btn on" id="view-scroll" onclick="setView('scroll')">📜 滚动</button>
    <button class="btn" id="view-compare" onclick="setView('compare')">⚖️ 对比</button>
    <button class="btn" id="btn-anno" onclick="toggleAnno()">✎ 批注</button>
  </div>
</div>

<!-- 批注导出弹窗 -->
<div class="export-modal" id="exportModal" style="position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;display:none">
  <div style="background:var(--bg1);border:1px solid var(--border);border-radius:18px;width:90%;max-width:560px;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,0.5);transform:translateY(20px);transition:transform .3s">
    <div style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px">
      <span style="font-size:15px;font-weight:800">📋 批注汇总</span>
      <span style="margin-left:auto;cursor:pointer;font-size:18px;color:var(--text2)" onclick="closeExportModal()">✕</span>
    </div>
    <div style="flex:1;overflow-y:auto;padding:16px 20px">
      <pre id="exportContent" style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;font-size:12px;line-height:1.8;color:var(--text2);white-space:pre-wrap;word-break:break-all;font-family:inherit;max-height:50vh;overflow-y:auto"></pre>
    </div>
    <div style="padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end">
      <button class="btn-sm" onclick="closeExportModal()">关闭</button>
      <button class="btn-sm" onclick="copyExportAll()" id="copyAllBtn" style="background:var(--gold2);color:var(--gold);border-color:rgba(255,196,71,0.3)">📋 复制全部</button>
    </div>
  </div>
</div>

<!-- 批注面板 -->
<div class="anno-panel" id="annoPanel">
  <div class="anno-edit">
    <div class="anno-edit-head">
      <span>📝 批注</span>
      <span class="close" onclick="toggleAnno()">✕</span>
    </div>
    <div class="anno-edit-sub" id="annoSub">点击歌词行添加批注</div>
    <textarea class="anno-textarea" id="annoText" placeholder="在此输入批注..." onkeydown="if(event.key==='Enter'&&event.ctrlKey)saveAnno()"></textarea>
    <div class="anno-actions">
      <button class="btn-sm" onclick="saveAnno()" style="background:var(--gold2);color:var(--gold);border-color:rgba(255,196,71,0.3)">💾 保存</button>
      <button class="btn-sm" onclick="openExportModal()">📤 导出</button>
      <button class="btn-sm" onclick="clearAnno()" style="color:var(--r)">🗑️ 清空</button>
    </div>
  </div>
  <div class="anno-list" id="annoList">
    <div class="anno-list-head">已批注内容</div>
    <div class="anno-empty" id="annoEmpty">暂无批注，点击歌词行添加</div>
  </div>
</div>

<div class="main">
  <div class="view on scroll-view" id="view-scroll-el"><div id="scrollContainer"></div></div>
  <div class="view compare-view" id="view-compare-el"><div class="compare-grid cols-3" id="compareGrid"></div></div>
</div>

<script>
const TYPE_LABELS={intro:'Intro',verse:'Verse',pre:'Pre-Chorus',chorus:'Chorus',bridge:'Bridge',hook:'Hook',interlude:'Interlude',outro:'Outro'};

let data={
  a:{name:'龙舟上的时间',model:'Lysa 手写版',prompt:'以父与子的龙舟传承为核心，口语化叙述感强，长句为主，画面说话。',secs:[
    {type:'intro',style:'江边清晨',lyrics:'（江边清晨，雾还没散，有人在整理缆绳的声音）'},
    {type:'verse',style:'第一人称叙述',lyrics:'我爸他从船上下来的时候我看见他膝盖上全是泥\n他蹲下来把我抱上去的时候我那时候大概才五岁\n他的手碰到我脖子的时候我觉得有点扎是粗糙的\n但他笑起来的时候眼睛会眯成一条缝那个样子我记得很清楚\n他把桨递给我让我先感受一下那个重量说等过了端午节你就要学会自己划了\n那天的太阳很烈水面全是金光我眯着眼睛看他\n他站在船头的样子像一座塑像一样我那时候觉得他什么都扛得住'},
    {type:'pre',style:'内心独白',lyrics:'后来很多年我都在想那一天他到底在想什么\n他有没有想过这个小孩以后也会站他那个位置\n我那时候什么都不懂只知道他的手很暖而江风很凉\n他说话的声音被风吹散了一半我听不太清楚但我记住了'},
    {type:'chorus',style:'情感爆发',lyrics:'端午节的早上鼓声会从水面上传过来一直震动到胸口\n我爸他会站在船头用桨尖指着前方那个方向大声喊一二三\n我跟着他的节奏划水浪花溅起来的时候会打湿我的袖子我从来没有躲过\n这么多年过去了我开始理解为什么他每年都要回来那条江\n那些浪花其实从未改变过就像他当年教我的时候一样\n但他的背已经驼了而我变成了那个站在船头的人\n每次龙舟转弯的时候我都会想起他当年的动作我跟着他划\n我终于活成了他的样子这句话我不想说但我心里知道就是这样'},
    {type:'verse',style:'Melody Rap',lyrics:'去年端午他坐船尾的时候一直在咳嗽我说你别划了\n他说再划几趟吧就不划了然后他就笑了一下\n我把桨握紧发现木头上有一块地方特别亮那是他握了二十年才磨出来的\n每年端午他都要用舌头舔一下绳结说这样绑比较结实我试过一次很咸\n今年他没有来我在船上闻到他以前喝过的茶的味道\n他教我的那些东西都在我手上老茧下面\n原来他一直在用这种方式留给我一些什么我每次划桨的时候都能感觉到他在'},
    {type:'pre',style:'现在视角',lyrics:'现在换我站在船头看着前方水天相接的地方\n身后那些年轻的桨手在等我的指令\n我喊了开始然后鼓声响起水花飞溅到脸上\n我想起我爸说过的话浪大的时候不要怕只要你稳住它就会带你走'},
    {type:'chorus',style:'传承确认',lyrics:'端午节的早上鼓声从水面上传过来震动到胸口\n我站在船头用桨尖指着前方那个方向喊一二三\n水花溅起来的时候打湿了我的袖子但我没有躲\n这么多年过去原来他每年回来都是在确认一件事\n那些浪花从未改变就像他当年教我的时候一样\n现在换我站在他站过的位置成为那个被看的人\n每次龙舟转弯的时候我都会想起他当年的样子\n我终于知道他当年在等什么了'},
    {type:'hook',style:'情感收尾',lyrics:'（延续Chorus的情绪，逐句收紧，在最后一句稍作停顿后轻轻收束）'},
    {type:'outro',style:'留白',lyrics:'船靠岸的时候天已经亮了\n我爸他在岸边站着等我\n他什么也没说我什么也没说\n我们就这样走回去'}
  ]},
  b:{name:'龙舟上的时间',model:'Qwen 72B',prompt:'偏诗化，部分说理感，三代视角（父→我→子），用词相对工整对仗。',secs:[
    {type:'intro',style:'回忆',lyrics:'偷偷翻出来那条旧龙舟，上头还留着爸爸的汗味'},
    {type:'verse',style:'童年视角',lyrics:'记得小时候，爸爸带我去河边\n那龙舟就像个大玩具，我们俩心跳得快\n他教我划桨，手把手\n手上的茧，磨得我生疼\n汗珠子顺着脊梁流\n但我没喊累，想让他刮目相看\n河面的风，吹得皮肤都发紧\n爸爸的笑容，比胜利的号角还响亮'},
    {type:'pre',style:'时间感慨',lyrics:'那时候的我，以为能划一辈子\n爸爸总在前面，带我去冒险\n一条河，两颗心\n时间在桨声里悄悄流逝'},
    {type:'chorus',style:'传承',lyrics:'现在我坐在他的位置，感觉肩膀沉甸甸\n看到我手上的茧，爸爸似乎老了几岁\n桨在水里划出岁月的痕迹\n每一道波纹都藏着故事\n风还是那样吹，太阳还是那样晒\n只是我现在成了那个带路的人\n龙舟上的时间，一圈一圈绕着转\n每转一圈，心就更暖一点'},
    {type:'verse',style:'成年视角',lyrics:'每到端午，就想起那段时光\n龙舟上的笑声，和水花一起飞扬\n爸爸那时候，眼神里全是光\n现在轮到我，心里面藏希望\n那条旧龙舟，每次看都像是新发现\n每一个划过的痕迹，都有他的影子\n今年端午，我叫上了儿子\n他握着桨，那一刻，我明白了传承'},
    {type:'pre',style:'儿子视角',lyrics:'儿子的手，小而坚定\n看着他，就像看到过去的自己\n龙舟上的我们\n继续划向未来的远方'},
    {type:'chorus',style:'三代传承',lyrics:'儿子坐在我的位置，我站在爸爸的影子里\n他的每一下划桨，都让我想起那些日子\n桨声依旧，只是力量来自新的方向\n我们一起，把这条河划得更宽广\n太阳高挂，风轻云淡\n我看着他，就像爸爸当年看我\n龙舟上的时间，绵延不绝\n每一代人，都有自己的时刻'},
    {type:'hook',style:'情感收束',lyrics:'（延续三代传承的主题，在最后一句轻轻收束）'},
    {type:'outro',style:'留白',lyrics:'龙舟上的故事，一代接着一代\n时间在桨声里，轻轻唱着歌'}
  ]},
  c:{name:'龙舟上的时间',model:'Gemini 2.5-pro',prompt:'画面感强，句式偏工整，文学性强，部分句子刻意工对，意象更丰富。',secs:[
    {type:'intro',style:'环境开场',lyrics:'（江水流淌声，远处传来模糊的鼓点，渐强）'},
    {type:'verse',style:'白描',lyrics:'老桨搁在岸边，桨叶沾着潮气\n你弯腰系着布鞋，背影有点长\n手臂上的汗珠，顺着皱纹淌下来\n老龙舟静静浮着，船身红漆掉了一块\n你摸了摸船舷，手指粗糙像树皮\n没说什么，只是点了根烟\n烟圈飘到江面，慢慢散开\n我站在你身后，学着你的样子深呼吸'},
    {type:'pre',style:'低沉',lyrics:'清晨的风吹过，有点凉\n旧的船歌，你哼得低沉\n那些调子，我好像听过好几趟\n却从来没开口，跟着唱'},
    {type:'chorus',style:'核心意象',lyrics:'龙舟上的时间啊，一圈一圈晃\n水花拍在脸上，咸咸的，有点烫\n旧的桨，握在手里，越握越亮\n江风吹过耳朵，那些话不用讲\n汗水湿了衣裳，又被太阳晒干\n肩膀碰着肩膀，一个劲儿往前闯\n不是为了什么输赢，就为那一声响\n船头劈开水面，劈开一年的过往'},
    {type:'verse',style:'时间跨度',lyrics:'小时候，我坐在船头，晃得东倒西歪\n看你光着膀子，青筋在胳膊上鼓起来\n那时只觉得好玩，根本不懂什么叫排开\n后来换我上船，桨叶压不住水，总会歪\n你也没骂我，就用眼角瞥了一下\n我学着你的姿势，一点一点，把劲儿往下拽\n河道两边的风景，这么多年，还是老样子\n只有船上的人，换了一拨又一拨，又换回来'},
    {type:'pre',style:'重复低吟',lyrics:'清晨的风吹过，有点凉\n旧的船歌，你哼得低沉\n那些调子，我好像听过好几趟\n却从来没开口，跟着唱'},
    {type:'chorus',style:'完整复叠',lyrics:'龙舟上的时间啊，一圈一圈晃\n水花拍在脸上，咸咸的，有点烫\n旧的桨，握在手里，越握越亮\n江风吹过耳朵，那些话不用讲\n汗水湿了衣裳，又被太阳晒干\n肩膀碰着肩膀，一个劲儿往前闯\n不是为了什么输赢，就为那一声响\n船头劈开水面，劈开一年的过往'},
    {type:'hook',style:'情感收束',lyrics:'（延续核心意象，逐句收紧，最后以一声划桨收束）'},
    {type:'outro',style:'渐弱',lyrics:'（渐弱的划桨声，混着远处新龙舟的鼓点）'}
  ]}
};

let viewMode='scroll',annoMode=false,currentAnno=null,notes={},visibleVers={a:true,b:true,c:true};

// ========== 滚动模式渲染 ==========
function renderScroll(){
  if(window.scrollObserver){window.scrollObserver.disconnect()}
  const c=document.getElementById('scrollContainer');
  c.innerHTML=['a','b','c'].map(v=>{
    const secHtml=data[v].secs.map((sec,idx)=>{
      const tn=data[v].secs.filter((s,i)=>i<idx&&s.type===sec.type).length+1;
      const label=TYPE_LABELS[sec.type]+(tn>1&&sec.type!=='intro'&&sec.type!=='outro'&&sec.type!=='bridge'?' '+tn:'');
      return `<div class="sec" data-idx="${idx}" data-ver="${v}">
        <div class="sec-head">
          <select class="sec-type" onchange="setType('${v}',${idx},this.value)">${Object.entries(TYPE_LABELS).map(([k,l])=>`<option value="${k}" ${k===sec.type?'selected':''}>${l}</option>`).join('')}</select>
          <input class="sec-style" placeholder="风格标签" value="${sec.style}" onchange="setStyle('${v}',${idx},this.value)">
          <button class="sec-del" onclick="delSec('${v}',${idx})">×</button>
        </div>
        <div class="sec-body">
          <textarea class="lyric-input" placeholder="填入歌词，每行一句..." oninput="setLyrics('${v}',${idx},this.value)">${sec.lyrics}</textarea>
          <div class="lyric-lines">${renderLines(v,idx,sec.lyrics)}</div>
          <div class="sec-actions">
            <button class="btn-copy" id="cp-${v}-${idx}" onclick="copySec('${v}',${idx},this)">📋 复制</button>
          </div>
        </div>
      </div>`;
    }).join('');
    return `<div class="ver-block ${v}" id="block-${v}">
      <div class="ver-header">
        <div class="ver-title-row">
          <input class="ver-name" placeholder="填入歌名" id="name-${v}" value="${data[v].name}" onchange="data.${v}.name=this.value">
          <input class="ver-model" placeholder="生成模型" id="model-${v}" value="${data[v].model}" onchange="data.${v}.model=this.value">
        </div>
        <div class="prompt-row">
          <textarea class="prompt-input" placeholder="填入生成 Prompt..." id="prompt-${v}" onchange="data.${v}.prompt=this.value">${data[v].prompt}</textarea>
          <button class="btn-sm" id="cpp-${v}" onclick="copyPrompt('${v}',this)">📋 复制Prompt</button>
          <button class="btn-sm" id="cpl-${v}" onclick="copyAllLyrics('${v}',this)">📋 复制歌词</button>
        </div>
      </div>
      <div class="ver-body">${secHtml}</div>
      <div class="add-wrap"><button class="add-btn-fancy" onclick="addSec('${v}','verse')">+</button></div>
    </div>`;
  }).join('');
}

function renderLines(v,si,lyrics){
  if(!lyrics)return '<div class="ly-line" data-line="0" onclick="clickLine(this)"><span style="color:var(--text3)">（空行）</span></div>';
  return lyrics.split('\n').map((line,i)=>{
    const n=getNote(v,si,i),isActive=currentAnno&&currentAnno.ver===v&&currentAnno.secIdx===si&&currentAnno.lineIdx===i;
    return `<div class="ly-line ${n?'has-anno':''}${isActive?' active-anno':''}" data-line="${i}" onclick="clickLine(this)">${escapeHtml(line)||'<span style="color:var(--text3)">（空行）</span>'}${n?'<span class="anno-badge">✎</span>':''}</div>`;
  }).join('');
}
function escapeHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// ========== 数据操作 ==========
function addSec(v,t){data[v].secs.push({type:t,style:'',lyrics:''});renderScroll();updateAnnoList()}
function delSec(v,i){data[v].secs.splice(i,1);renderScroll();updateAnnoList()}
function setType(v,i,t){data[v].secs[i].type=t;renderScroll()}
function setStyle(v,i,t){data[v].secs[i].style=t}
function setLyrics(v,i,t){data[v].secs[i].lyrics=t;const b=document.getElementById('block-'+v);if(b){const s=b.querySelectorAll('.sec')[i];if(s)s.querySelector('.lyric-lines').innerHTML=renderLines(v,i,t)}}

// ========== 复制功能 ==========
function highlightBtn(btn){
  if(!btn)return;
  btn.classList.add('copied');
  const orig=btn.textContent;
  btn.textContent='✓ 已复制';
  setTimeout(()=>{btn.classList.remove('copied');btn.textContent=orig},3000);
}
function copySec(v,i,btn){
  const sec=data[v].secs[i];const text=`[${TYPE_LABELS[sec.type]}${sec.style?' · '+sec.style:''}]\n${sec.lyrics}`;
  navigator.clipboard.writeText(text).catch(()=>{});
  highlightBtn(btn);
}
function copyPrompt(v,btn){
  navigator.clipboard.writeText(data[v].prompt).catch(()=>{});
  highlightBtn(btn);
}
function copyAllLyrics(v,btn){
  const all=data[v].secs.map(s=>`[${TYPE_LABELS[s.type]}]\n${s.lyrics}`).join('\n\n');
  navigator.clipboard.writeText(all).catch(()=>{});
  highlightBtn(btn);
}

// ========== 视图切换 ==========
function setView(m){
  viewMode=m;
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('on'));
  document.querySelectorAll('.tools .btn').forEach(el=>{if(el.id==='view-scroll'||el.id==='view-compare')el.classList.remove('on')});
  document.getElementById('view-'+m+'-el').classList.add('on');
  document.getElementById('view-'+m).classList.add('on');
  if(m==='scroll'){
    visibleVers={a:true,b:true,c:true};
    ['a','b','c'].forEach(v=>document.getElementById('tab-'+v).classList.add('on'));
    renderScroll();
    setTimeout(setupScrollHighlight,50);
  }else{
    if(window.scrollObserver)window.scrollObserver.disconnect();
    renderCompare()
  }
}

// ========== 红绿蓝按钮 ==========
function toggleVerTab(v){
  if(viewMode==='scroll'){
    document.getElementById('tab-'+v).classList.add('on');
    const b=document.getElementById('block-'+v);
    if(b)b.scrollIntoView({behavior:'smooth',block:'start'});
  }else{
    const active=['a','b','c'].filter(k=>visibleVers[k]);
    if(visibleVers[v]&&active.length<=2)return;//至少留两盏
    visibleVers[v]=!visibleVers[v];
    document.getElementById('tab-'+v).classList.toggle('on',visibleVers[v]);
    renderCompare();
  }
}

// ========== 对比模式 ==========
function renderCompare(){
  const grid=document.getElementById('compareGrid');
  const n=['a','b','c'].filter(v=>visibleVers[v]).length;
  grid.className='compare-grid cols-'+Math.max(n,1);
  grid.innerHTML=['a','b','c'].filter(v=>visibleVers[v]).map(v=>{
    return `<div class="comp-col ${v}">
      <div class="comp-head ${v}">${data[v].name||'版本 '+v.toUpperCase()}</div>
      <div class="comp-body">${data[v].secs.map((sec,idx)=>{
        const tn=data[v].secs.filter((s,i)=>i<idx&&s.type===sec.type).length+1;
        const label=TYPE_LABELS[sec.type]+(tn>1?' '+tn:'');
        const lineHtml=sec.lyrics?sec.lyrics.split('\n').map((line,i)=>{
          const n=getNote(v,idx,i),isActive=currentAnno&&currentAnno.ver===v&&currentAnno.secIdx===idx&&currentAnno.lineIdx===i;
          return `<div class="ly-line ${n?'has-anno':''}${isActive?' active-anno':''}${annoMode?'':' noclick'}" data-line="${i}" onclick="${annoMode?`clickLineCompare(this,'${v}',${idx},${i})`:''}" style="padding:3px 6px;font-size:13px;line-height:1.8;border-radius:4px;cursor:${annoMode?'pointer':'default'}">${escapeHtml(line)||'（空行）'}${n?'<span class="anno-badge">✎</span>':''}</div>`;
        }).join(''):'<span style="color:var(--text3)">（无歌词）</span>';
        return `<div class="comp-sec"><div class="comp-sec-label">${label}${sec.style?' · '+sec.style:''}</div><div>${lineHtml}</div></div>`;
      }).join('')}</div>
    </div>`;
  }).join('');
}

function clickLineCompare(el,v,si,li){
  if(!annoMode)return;
  currentAnno={ver:v,secIdx:si,lineIdx:li};
  const lineText=data[v].secs[si].lyrics.split('\n')[li]||'';
  document.getElementById('annoSub').innerHTML=`版本 ${v.toUpperCase()} · ${TYPE_LABELS[data[v].secs[si].type]} · 第${li+1}行<br><span style="color:var(--text2);font-size:11px">${escapeHtml(lineText.substring(0,40))}${lineText.length>40?'...':''}</span>`;
  document.getElementById('annoText').value=getNote(v,si,li);
  renderCompare();renderScroll();updateAnnoList();
}

// ========== 批注系统 ==========
function toggleAnno(){
  annoMode=!annoMode;
  document.getElementById('btn-anno').classList.toggle('on',annoMode);
  document.getElementById('annoPanel').classList.toggle('on',annoMode);
  document.body.classList.toggle('annotate-on',annoMode);
  if(viewMode==='scroll')renderScroll();else renderCompare();
}

function clickLine(el){
  if(!annoMode)return;
  const secEl=el.closest('.sec');const v=secEl.dataset.ver;
  const si=parseInt(secEl.dataset.idx),li=parseInt(el.dataset.line);
  currentAnno={ver:v,secIdx:si,lineIdx:li};
  const lineText=data[v].secs[si].lyrics.split('\n')[li]||'';
  document.getElementById('annoSub').innerHTML=`版本 ${v.toUpperCase()} · ${TYPE_LABELS[data[v].secs[si].type]} · 第${li+1}行<br><span style="color:var(--text2);font-size:11px">${escapeHtml(lineText.substring(0,40))}${lineText.length>40?'...':''}</span>`;
  document.getElementById('annoText').value=getNote(v,si,li);
  renderScroll();if(viewMode==='compare')renderCompare();updateAnnoList();
}

function saveAnno(){
  if(!currentAnno)return;
  const {ver,secIdx,lineIdx}=currentAnno;
  const key=`${ver}-${secIdx}-${lineIdx}`;
  const val=document.getElementById('annoText').value.trim();
  if(val)notes[key]=val;else delete notes[key];
  if(viewMode==='scroll')renderScroll();else renderCompare();
  updateAnnoList();
}

function getNote(v,si,li){return notes[`${v}-${si}-${li}`]||''}

function updateAnnoList(){
  const list=document.getElementById('annoList');
  const items=Object.entries(notes).map(([key,text])=>{
    const [v,si,li]=key.split('-');
    const sec=data[v].secs[parseInt(si)];
    if(!sec)return'';
    const lyricLine=(sec.lyrics.split('\n')[parseInt(li)]||'').trim();
    return `<div class="anno-item">
      <div class="anno-item-source">版本 ${v.toUpperCase()} · ${TYPE_LABELS[sec.type]} · 第${parseInt(li)+1}行</div>
      <div class="anno-item-lyric">"${escapeHtml(lyricLine.substring(0,50))}${lyricLine.length>50?'...':''}"</div>
      <div class="anno-item-text">${escapeHtml(text)}</div>
      <button class="anno-item-del" onclick="delNote('${key}')">删除</button>
    </div>`;
  }).filter(Boolean);
  if(items.length===0){list.innerHTML='<div class="anno-list-head">已批注内容</div><div class="anno-empty">暂无批注，点击歌词行添加</div>';return}
  list.innerHTML='<div class="anno-list-head">已批注内容 ('+items.length+')</div>'+items.join('');
}

function delNote(key){delete notes[key];if(viewMode==='scroll')renderScroll();else renderCompare();updateAnnoList()}

function openExportModal(){
  const lines=Object.entries(notes).map(([key,text])=>{
    const [v,si,li]=key.split('-');const sec=data[v].secs[parseInt(si)];
    const line=(sec.lyrics.split('\n')[parseInt(li)]||'').trim();
    return `[${v.toUpperCase()} · ${TYPE_LABELS[sec.type]} · 第${parseInt(li)+1}行]\n原文: ${line}\n批注: ${text}`;
  });
  document.getElementById('exportContent').textContent=lines.join('\n\n---\n\n')||'暂无批注';
  const m=document.getElementById('exportModal');
  m.style.display='flex';requestAnimationFrame(()=>{m.style.opacity='1';m.style.pointerEvents='auto';m.querySelector('div').style.transform='translateY(0)'});
}
function closeExportModal(){
  const m=document.getElementById('exportModal');
  m.style.opacity='0';m.style.pointerEvents='none';m.querySelector('div').style.transform='translateY(20px)';
  setTimeout(()=>{m.style.display='none'},300);
}
function copyExportAll(){
  const text=document.getElementById('exportContent').textContent;
  navigator.clipboard.writeText(text).catch(()=>{});
  highlightBtn(document.getElementById('copyAllBtn'));
}

function clearAnno(){if(!confirm('确定清空所有批注？'))return;notes={};currentAnno=null;if(viewMode==='scroll')renderScroll();else renderCompare();updateAnnoList()}

// ========== 日期标题 ==========
document.getElementById('pageTitle').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\//g,'-')+' · 三版赛马展示';

// ========== 粒子背景 ==========
(function(){const c=document.getElementById('particles'),x=c.getContext('2d');let w,h,p=[];function resize(){w=c.width=innerWidth;h=c.height=innerHeight}resize();addEventListener('resize',resize);for(let i=0;i<40;i++)p.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*1.2+.3});function draw(){x.clearRect(0,0,w,h);p.forEach(pt=>{x.beginPath();x.arc(pt.x,pt.y,pt.r,0,Math.PI*2);x.fillStyle='rgba(79,140,255,0.2)';x.fill();pt.x+=pt.vx;pt.y+=pt.vy;if(pt.x<0||pt.x>w)pt.vx*=-1;if(pt.y<0||pt.y>h)pt.vy*=-1});requestAnimationFrame(draw)}draw()})();

// ========== 滚动高亮监听 ==========
function setupScrollHighlight(){
  if(!window.scrollObserver){
    window.scrollObserver=new IntersectionObserver((entries)=>{
      if(viewMode!=='scroll')return;
      let maxRatio=0,maxVer=null;
      entries.forEach(e=>{if(e.intersectionRatio>maxRatio){maxRatio=e.intersectionRatio;maxVer=e.target.dataset.ver}});
      if(maxVer){['a','b','c'].forEach(v=>{document.getElementById('tab-'+v).classList.toggle('on',v===maxVer)})}
    },{threshold:[0,0.1,0.3,0.5,0.7,0.9,1],rootMargin:'-70px 0px -50% 0px'});
  }
  ['a','b','c'].forEach(v=>{
    const b=document.getElementById('block-'+v);
    if(b){b.dataset.ver=v;window.scrollObserver.observe(b)}
  });
}

// ========== 初始化 ==========
renderScroll();
setTimeout(setupScrollHighlight,100);
</script>
</body>
</html>
